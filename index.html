<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1020">

<title>Micron15</title>

<style>
*{
  box-sizing:border-box;
}

body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#0b1020;
  color:white;
  margin:0;
  padding:18px;
  text-align:center;
}

.card{
  max-width:520px;
  margin:10px auto;
  padding:26px 22px;
  border-radius:24px;
  background:#151c33;
  box-shadow:0 10px 40px #0006;
}

h1{
  font-size:34px;
  margin:5px 0;
}

.sub{
  opacity:.7;
  margin-bottom:20px;
}

.status{
  font-size:14px;
  opacity:.7;
  margin-top:8px;
}

.signal{
  font-size:52px;
  font-weight:800;
  margin:25px 0 5px;
}

.up{
  color:#36d17a;
}

.down{
  color:#ff5c67;
}

.neutral{
  color:#ffd166;
}

.pct{
  font-size:25px;
  font-weight:600;
  margin-bottom:25px;
}

.row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px 0;
  border-bottom:1px solid #ffffff18;
}

.row span{
  opacity:.75;
}

.row b{
  font-size:17px;
}

.refresh{
  margin-top:22px;
  width:100%;
  padding:14px;
  border:0;
  border-radius:14px;
  background:#263354;
  color:white;
  font-size:16px;
  font-weight:600;
}

.refresh:active{
  transform:scale(.98);
}

.small{
  font-size:12px;
  opacity:.5;
  margin-top:20px;
  line-height:1.5;
}
</style>
</head>

<body>

<div class="card">

<h1>Micron15</h1>

<div class="sub">
Micron Technology · MU
</div>

<div id="signal" class="signal neutral">
LADDAR
</div>

<div id="pct" class="pct">
-- %
</div>

<div class="row">
<span>Senaste pris</span>
<b id="price">--</b>
</div>

<div class="row">
<span>15 min förändring</span>
<b id="dir">--</b>
</div>

<div class="row">
<span>Senaste uppdatering</span>
<b id="time">--</b>
</div>

<div class="status" id="status">
Hämtar marknadsdata...
</div>

<button class="refresh" onclick="loadData()">
↻ Uppdatera nu
</button>

<div class="small">
Indikativ sannolikhetsmodell – inte investeringsråd.<br>
Marknadsdata kan vara fördröjd.
</div>

</div>

<script>

const signalEl = document.getElementById("signal");
const pctEl = document.getElementById("pct");
const priceEl = document.getElementById("price");
const dirEl = document.getElementById("dir");
const timeEl = document.getElementById("time");
const statusEl = document.getElementById("status");


async function loadData(){

  statusEl.textContent = "Hämtar ny data...";

  try{

    const url =
      "https://query1.finance.yahoo.com/v8/finance/chart/MU" +
      "?range=1d&interval=1m&includePrePost=true";

    const response = await fetch(
      url,
      {
        cache:"no-store"
      }
    );

    if(!response.ok){
      throw new Error("HTTP "+response.status);
    }

    const data = await response.json();

    if(
      !data ||
      !data.chart ||
      !data.chart.result ||
      !data.chart.result[0]
    ){
      throw new Error("Ingen marknadsdata");
    }

    const result = data.chart.result[0];

    const closes =
      result.indicators.quote[0].close
      .filter(
        value =>
        typeof value === "number" &&
        Number.isFinite(value)
      );

    if(closes.length < 16){
      throw new Error("För lite data");
    }

    const price = closes[closes.length-1];

    const oldPrice =
      closes[closes.length-16];

    const change =
      ((price-oldPrice)/oldPrice)*100;


    /*
      Enkel 15-minuters momentum-modell.
      50 = neutral.
    */

    let score =
      50 + (change * 12);

    score =
      Math.max(
        5,
        Math.min(
          95,
          score
        )
      );


    let signal;
    let className;

    if(score >= 55){

      signal = "UPP";
      className = "up";

    }else if(score <= 45){

      signal = "NER";
      className = "down";

    }else{

      signal = "NEUTRAL";
      className = "neutral";

    }


    signalEl.className =
      "signal " + className;

    signalEl.textContent =
      signal;


    pctEl.textContent =
      Math.round(score) +
      "% sannolikhet upp";


    priceEl.textContent =
      "$" +
      price.toFixed(2);


    dirEl.textContent =
      (change >= 0 ? "+" : "") +
      change.toFixed(2) +
      "%";


    const now =
      new Date();

    timeEl.textContent =
      now.toLocaleTimeString(
        "sv-SE",
        {
          hour:"2-digit",
          minute:"2-digit",
          second:"2-digit"
        }
      );


    statusEl.textContent =
      "✓ Data uppdaterad";


  }catch(error){

    console.error(error);

    statusEl.textContent =
      "⚠ Kunde inte uppdatera data";

  }

}


/*
  Ladda direkt när sidan öppnas
*/

loadData();


/*
  Automatisk uppdatering
  var 30:e sekund
*/

setInterval(
  loadData,
  30000
);

</script>

</body>
</html>
