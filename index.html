<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Micron15</title>

<style>
body{
  font-family:-apple-system,BlinkMacSystemFont,sans-serif;
  background:#0b1020;
  color:white;
  margin:0;
  padding:24px;
  text-align:center
}

.card{
  max-width:520px;
  margin:20px auto;
  padding:28px;
  border-radius:24px;
  background:#151c33;
  box-shadow:0 10px 40px #0006
}

h1{
  font-size:34px;
  margin:8px
}

.sub{
  opacity:.7
}

.signal{
  font-size:48px;
  font-weight:800;
  margin:28px 0 8px
}

.up{
  color:#36d17a
}

.down{
  color:#ff5c67
}

.neutral{
  color:#ffd166
}

.pct{
  font-size:24px;
  margin-bottom:25px
}

.row{
  display:flex;
  justify-content:space-between;
  padding:14px 0;
  border-bottom:1px solid #ffffff18
}

.small{
  font-size:13px;
  opacity:.6;
  margin-top:24px
}
</style>
</head>

<body>

<div class="card">

<h1>Micron15</h1>

<div class="sub">
Micron Technology · MU
</div>

<div id="signal" class="signal neutral">
LADDAR
</div>

<div id="pct" class="pct">
--
</div>

<div class="row">
<span>Senaste pris</span>
<b id="price">--</b>
</div>

<div class="row">
<span>15 min riktning</span>
<b id="dir">--</b>
</div>

<div class="row">
<span>Uppdaterad</span>
<b id="time">--</b>
</div>

<div class="small">
Indikativ sannolikhetsmodell – inte investeringsråd.<br>
Data kan vara fördröjd.
</div>

</div>

<script>

async function load(){

try{

const r = await fetch(
'https://query1.finance.yahoo.com/v8/finance/chart/MU?range=1d&interval=1m'
);

const j = await r.json();

const x = j.chart.result[0];

const c =
x.indicators.quote[0].close
.filter(Number.isFinite);

const p = c.at(-1);

const old = c.at(-16);

const ch = ((p-old)/old)*100;


/* 15-minuters momentum-modell */

let score =
50 + Math.max(
-30,
Math.min(
30,
ch*12
)
);


const signal =
document.getElementById('signal');

const direction =
document.getElementById('dir');


let cls;
let txt;


if(score > 55){

cls='up';
txt='UPP';

}

else if(score < 45){

cls='down';
txt='NER';

}

else{

cls='neutral';
txt='NEUTRAL';

}


signal.className =
'signal '+cls;

signal.textContent =
txt;


document.getElementById('pct')
.textContent =
Math.round(score)+'% sannolikhet upp';


document.getElementById('price')
.textContent =
'$'+p.toFixed(2);


direction.textContent =
(ch>=0?'+':'')+
ch.toFixed(2)+
'% senaste 15 min';


document.getElementById('time')
.textContent =
new Date().toLocaleTimeString(
'sv-SE'
);


}

catch(e){

document.getElementById('signal')
.textContent='DATAFEL';

document.getElementById('pct')
.textContent=
'Försök igen om en stund';

}

}


load();

setInterval(
load,
60000
);

</script>

</body>
</html>
